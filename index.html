```html
<!DOCTYPE html>
<html>

<head>

  <base target="_self">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #dbeafe,
        #f0f9ff
      );
      min-height: 100vh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
    }

    .main-box {

      background: #ffffff;

      border-radius: 35px;

      border: 6px solid #1d4ed8;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.25);

      padding:
        40px 35px 140px 35px;

      min-height: 95vh;
    }


    /* =========================
       TITLE
       ========================= */

    h1 {

      font-size: 60px;

      font-weight: 900;

      margin-bottom: 30px;

      text-align: center;
    }


    /* =========================
       LABELS
       ========================= */

    label {

      font-size: 40px;

      font-weight: 800;

      margin-top: 25px;

      display: block;
    }


    /* =========================
       INPUTS
       ========================= */

    input,
    select {

      width: 100%;

      padding: 35px;

      font-size: 45px;

      border-radius: 25px;

      border: 4px solid #cbd5e1;

      margin-top: 10px;

      margin-bottom: 25px;

      background: #ffffff;
    }


    input:focus,
    select:focus {

      outline: none;

      border-color: #1d4ed8;

      box-shadow:
        0 0 0 5px
        rgba(29,78,216,0.15);
    }


    /* =========================
       SAVE BUTTON
       ========================= */

    .save-btn {

      position: fixed;

      bottom: 25px;

      left: 50%;

      transform: translateX(-50%);

      width: 92%;

      padding: 40px;

      font-size: 50px;

      font-weight: 900;

      border-radius: 30px;

      border: none;

      background:
        linear-gradient(
          90deg,
          #16a34a,
          #22c55e
        );

      color: white;

      box-shadow:
        0 18px 35px
        rgba(22,163,74,0.5);

      cursor: pointer;
    }


    .save-btn:disabled {

      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =========================
       POPUP
       ========================= */

    .overlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(0,0,0,0.35);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .3s ease;

      z-index: 999;
    }


    .overlay.active {

      opacity: 1;

      pointer-events: auto;
    }


    .popup {

      background: white;

      padding: 45px;

      border-radius: 35px;

      width: 90%;

      max-width: 700px;

      text-align: center;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.3);
    }


    .success-icon {

      font-size: 110px;

      margin-bottom: 15px;
    }


    .success-title {

      font-size: 50px;

      font-weight: 900;

      color: #16a34a;

      margin-bottom: 25px;
    }


    .success-text {

      font-size: 34px;

      line-height: 1.6;

      font-weight: 700;
    }


    .close-btn {

      margin-top: 30px;

      width: 100%;

      padding: 25px;

      font-size: 38px;

      font-weight: 900;

      border: none;

      border-radius: 20px;

      background: #1d4ed8;

      color: white;
    }


    /* =========================
       LOADING
       ========================= */

    .loading {

      position: fixed;

      inset: 0;

      background:
        rgba(255,255,255,0.75);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 1000;
    }


    .loading.active {

      display: flex;
    }


    .loading-box {

      background: white;

      padding: 45px;

      border-radius: 30px;

      font-size: 40px;

      font-weight: 900;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.25);
    }


    /* =========================
       MOBILE
       ========================= */

    @media(max-width:700px) {

      h1 {
        font-size: 42px;
      }

      label {
        font-size: 28px;
      }

      input,
      select {
        font-size: 30px;
        padding: 25px;
      }

      .save-btn {
        font-size: 36px;
        padding: 28px;
      }

    }

  </style>

</head>


<body>


<div class="page">

  <div class="main-box" id="entryBox">

    <h1>💰 Expense Entry</h1>


    <!-- DATE -->

    <label>Date</label>

    <input
      type="date"
      id="date">


    <!-- DAY -->

    <label>Day</label>

    <input
      type="text"
      id="day"
      readonly>


    <!-- CATEGORY -->

    <label>Category</label>

    <select id="category"
            onchange="loadSubCategories()">

      <option value="">
        Select Category
      </option>

    </select>


    <!-- SUB CATEGORY -->

    <label>Sub-Category</label>

    <select id="subCategory">

      <option value="">
        Select Sub-Category
      </option>

    </select>


    <!-- DESCRIPTION -->

    <label>Description</label>

    <input
      type="text"
      id="description"
      placeholder="Enter description">


    <!-- PAYMENT MODE -->

    <label>Payment Mode</label>

    <select id="paymentMode">

      <option value="">
        Select Payment Mode
      </option>

    </select>


    <!-- AMOUNT -->

    <label>Amount (₹)</label>

    <input
      type="number"
      id="amount"
      step="0.01"
      min="0"
      placeholder="Enter amount">


    <!-- NEED WANT -->

    <label>Need / Want</label>

    <select id="needWant">

      <option value="">
        Select
      </option>

      <option value="Need">
        Need
      </option>

      <option value="Want">
        Want
      </option>

    </select>

  </div>

</div>


<!-- SAVE BUTTON -->

<button
  class="save-btn"
  id="saveButton"
  onclick="submitEntry()">

  SAVE ENTRY

</button>


<!-- SUCCESS POPUP -->

<div
  id="overlay"
  class="overlay">

  <div class="popup">

    <div class="success-icon">
      ✅
    </div>

    <div class="success-title">
      Expense Saved
    </div>

    <div
      id="successText"
      class="success-text">
    </div>

    <button
      class="close-btn"
      onclick="closePopup()">

      ADD NEXT EXPENSE

    </button>

  </div>

</div>


<!-- LOADING -->

<div
  id="loading"
  class="loading">

  <div class="loading-box">

    Saving Expense...

  </div>

</div>


<script>

  let entryData = {};


  /* =========================
     API CONFIG
     ========================= */

  const API_URL = "https://script.google.com/macros/s/AKfycby5CH3_k9T3cueYHJXBcISO5I6JBIufs0yxrj9m0pN_NVavC9LFsnCH8ZeFjjeEkSMQ/exec";
  const API_TOKEN = "GyavinExpense2026@Secure#9274";

  function apiCall(action, payload) {

    return new Promise(function(resolve, reject) {

      if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
        reject(new Error("Set API_URL in Index.html first."));
        return;
      }

      const callbackName = "expenseApiCallback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const params = new URLSearchParams();

      params.set("action", action);
      params.set("token", API_TOKEN);
      params.set("callback", callbackName);

      if (payload !== null && payload !== undefined) {
        params.set("data", JSON.stringify(payload));
      }

      window[callbackName] = function(response) {
        cleanup();
        if (response && response.ok === false) {
          reject(new Error(response.error || "API error"));
        } else {
          resolve(response);
        }
      };

      function cleanup() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      script.onerror = function() {
        cleanup();
        reject(new Error("Unable to connect to Google Sheets backend."));
      };

      script.src = API_URL + "?" + params.toString();
      document.body.appendChild(script);

      setTimeout(function() {
        if (window[callbackName]) {
          cleanup();
          reject(new Error("Request timed out. Please check your internet connection."));
        }
      }, 20000);
    });
  }


  /* =========================
     INITIAL LOAD
     ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      setToday();

      apiCall("getEntryData", null)
        .then(function(data) {
          entryData = data;
          loadCategories();
          loadPaymentModes();
        })
        .catch(function(error) {
          alert("Unable to load data:\n" + error.message);
        });

    }
  );


  /* =========================
     TODAY
     ========================= */

  function setToday() {

    const today =
      new Date();

    const yyyy =
      today.getFullYear();

    const mm =
      String(
        today.getMonth() + 1
      ).padStart(2,"0");

    const dd =
      String(
        today.getDate()
      ).padStart(2,"0");


    document.getElementById(
      "date"
    ).value =
      yyyy + "-" + mm + "-" + dd;


    updateDay();

  }


  /* =========================
     DATE → DAY
     ========================= */

  document.getElementById(
    "date"
  ).addEventListener(
    "change",
    updateDay
  );


  function updateDay() {

    const value =
      document.getElementById(
        "date"
      ).value;

    if (!value) {

      document.getElementById(
        "day"
      ).value = "";

      return;
    }


    const d =
      new Date(
        value + "T00:00:00"
      );


    document.getElementById(
      "day"
    ).value =
      d.toLocaleDateString(
        "en-US",
        {
          weekday: "long"
        }
      );

  }


  /* =========================
     CATEGORIES
     ========================= */

  function loadCategories() {

    const select =
      document.getElementById(
        "category"
      );


    entryData.categories
      .forEach(function(category) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          category;

        option.text =
          category;

        select.appendChild(
          option
        );

      });

  }


  /* =========================
     SUB CATEGORIES
     ========================= */

  function loadSubCategories() {

    const category =
      document.getElementById(
        "category"
      ).value;


    const select =
      document.getElementById(
        "subCategory"
      );


    select.innerHTML =
      '<option value="">Select Sub-Category</option>';


    if (!category) return;


    const list =
      entryData.subCategories[
        category
      ] || [];


    list.forEach(
      function(sub) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          sub;

        option.text =
          sub;

        select.appendChild(
          option
        );

      }
    );

  }


  /* =========================
     PAYMENT MODES
     ========================= */

  function loadPaymentModes() {

    const select =
      document.getElementById(
        "paymentMode"
      );


    entryData.paymentModes
      .forEach(function(mode) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          mode;

        option.text =
          mode;

        select.appendChild(
          option
        );

      });

  }


  /* =========================
     SAVE
     ========================= */

  function submitEntry() {

    const data = {

      date:
        document.getElementById(
          "date"
        ).value,

      category:
        document.getElementById(
          "category"
        ).value,

      subCategory:
        document.getElementById(
          "subCategory"
        ).value,

      description:
        document.getElementById(
          "description"
        ).value.trim(),

      paymentMode:
        document.getElementById(
          "paymentMode"
        ).value,

      amount:
        document.getElementById(
          "amount"
        ).value,

      needWant:
        document.getElementById(
          "needWant"
        ).value

    };


    if (
      !data.date ||
      !data.category ||
      !data.subCategory ||
      !data.description ||
      !data.paymentMode ||
      !data.amount ||
      !data.needWant
    ) {

      alert(
        "Please complete all fields."
      );

      return;

    }


    const button =
      document.getElementById(
        "saveButton"
      );


    button.disabled = true;

    document.getElementById(
      "loading"
    ).classList.add("active");


    apiCall("saveExpense", data)
      .then(function(result) {

        document.getElementById("loading").classList.remove("active");
        button.disabled = false;

        document.getElementById("successText").innerHTML =
          "📅 " + data.date +
          "<br>" +
          "📂 " + data.category + " → " + data.subCategory +
          "<br>" +
          "💳 " + data.paymentMode +
          "<br>" +
          "💰 ₹" + Number(data.amount).toFixed(2);

        document.getElementById("overlay").classList.add("active");

      })
      .catch(function(error) {

        document.getElementById("loading").classList.remove("active");
        button.disabled = false;
        alert("Error:
" + error.message);

      });

  }


  /* =========================
     CLEAR FOR NEXT ENTRY
     ========================= */

  function closePopup() {

    document.getElementById(
      "overlay"
    ).classList.remove(
      "active"
    );


    document.getElementById(
      "description"
    ).value = "";


    document.getElementById(
      "amount"
    ).value = "";


    document.getElementById(
      "category"
    ).value = "";


    document.getElementById(
      "subCategory"
    ).innerHTML =
      '<option value="">Select Sub-Category</option>';


    document.getElementById(
      "paymentMode"
    ).value = "";


    document.getElementById(
      "needWant"
    ).value = "";


    document.getElementById(
      "date"
    ).focus();

  }

if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("sw.js").catch(function(err) {
        console.log("Service worker registration failed:", err);
      });
    });
  }

</script>


</body>

</html>
